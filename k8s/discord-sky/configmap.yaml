apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-sky-config
  namespace: discord-sky
data:
  DOTNET_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Bot__Status: "SnooPING AS usual"
  Bot__CommandPrefix: "!sky"
  Bot__RespondToDirectMention: "true"
  Bot__HistoryMessageLimit: "20"
  Bot__MemoryDataPath: "/app/data/user_memories"
  Bot__EnableUserMemory: "true"
  Bot__MaxMemoriesPerUser: "30"
  Bot__MemoryExtractionRate: "1.0"
  Bot__ConversationWindowTimeout: "00:03:00"
  Bot__MaxWindowMessages: "30"
  Bot__MaxWindowDuration: "00:30:00"
  Bot__MaxMemoriesPerExtraction: "15"
  Bot__EnableMemoryConsolidation: "true"
  Bot__ConsolidationTargetPercent: "0.75"
  # GPT-5.6 workload routing. Sol handles high-value persona work, Terra handles balanced ambient/audit/image
  # work, Luna handles structured memory maintenance, and gpt-5.4-mini remains the cheap non-reasoning judge.
  # ConfigMap values override the Secret because configMapRef follows secretRef in the Deployment.
  LLM__ActiveProvider: "OpenAI"
  LLM__Providers__OpenAI__ChatModel: "gpt-5.6-sol"
  LLM__Providers__OpenAI__AmbientModel: "gpt-5.6-terra"
  LLM__Providers__OpenAI__UtilityModel: "gpt-5.4-mini"
  LLM__Providers__OpenAI__ColdOpenModel: "gpt-5.6-sol"
  LLM__Providers__OpenAI__ColdOpenCriticModel: "gpt-5.6-terra"
  LLM__Providers__OpenAI__ImageRewriteModel: "gpt-5.6-terra"
  LLM__Providers__OpenAI__MemoryExtractionModel: "gpt-5.6-luna"
  LLM__Providers__OpenAI__MemoryConsolidationModel: "gpt-5.6-luna"
  LLM__Providers__OpenAI__MaxTokens: "1200"
  LLM__Providers__OpenAI__ReasoningEffort: "medium"
  LLM__Providers__OpenAI__AmbientReasoningEffort: "low"
  LLM__Providers__OpenAI__UtilityReasoningEffort: "none"
  LLM__Providers__OpenAI__ColdOpenReasoningEffort: "medium"
  LLM__Providers__OpenAI__ColdOpenCriticReasoningEffort: "low"
  LLM__Providers__OpenAI__ImageRewriteReasoningEffort: "medium"
  LLM__Providers__OpenAI__MemoryExtractionReasoningEffort: "none"
  LLM__Providers__OpenAI__MemoryConsolidationReasoningEffort: "none"
  LLM__Providers__OpenAI__UseResponsesApi: "true"
  # xAI/Grok, wired for background A/B experimentation only (fun_assessment 3.10). NOT active.
  # To run the experiment: set LLM__ActiveProvider=xAI (and put the key in the Secret as
  # LLM__Providers__xAI__ApiKey), redeploy, then score transcripts with tools/DiscordSky.FunScore.
  # grok-4.20-0309-reasoning is the most advanced model available; the non-reasoning sibling is the
  # cheaper choice for background memory extraction.
  LLM__Providers__xAI__Endpoint: "https://api.x.ai/v1"
  LLM__Providers__xAI__ChatModel: "grok-4.20-0309-reasoning"
  LLM__Providers__xAI__MemoryExtractionModel: "grok-4.20-0309-non-reasoning"
  LLM__Providers__xAI__MaxTokens: "1200"
  LLM__Providers__xAI__UseResponsesApi: "false"
  Chaos__AmbientReplyChance: "0.25"
  Chaos__MaxPromptsPerHour: "20"
  # Inner-thought worth gate. The roll remains the cost/opportunity sampler; the media-aware utility judge is
  # the quality gate. A non-queuing per-channel lease plus post-send quiet prevents burst replies.
  Chaos__UseWorthGate: "true"
  Chaos__AmbientWorthThreshold: "0.5"
  Chaos__AmbientReplyQuietSeconds: "90"
  # Proactive cold opens: LIVE TRIAL as of 2026-07-06 (2-day shadow harvest reviewed; owner cleared going live).
  # It now POSTS unprompted lines into secret-chat on Trump's Ballroom. KILL SWITCH: flip ColdOpen__ShadowMode
  # back to "true" (draft + log, never send), or ColdOpen__Enabled "false" to stop entirely.
  ColdOpen__Enabled: "true"
  ColdOpen__ShadowMode: "false"
  ColdOpen__Channels__0__Guild: "Trump's Ballroom"
  ColdOpen__Channels__0__Channel: "secret-chat"
  ColdOpen__WorthThreshold: "0.85"
  ColdOpen__MinDistinctHumans: "1"
  # LIVE cadence: tasteful + rare. Conservative caps so a bad streak cannot spam a real channel; the warm-lull
  # gate already limits fires to ~2-3/day on its own. Generous shadow-harvest caps were pulled back for live.
  ColdOpen__MaxPerDay: "3"
  ColdOpen__CooldownMinutes: "180"
  ColdOpen__JudgeCooldownMinutes: "20"
  # Telemetry sink path. MUST live inside the PVC mount; the PVC is mounted at
  # /app/data/user_memories so we nest telemetry there. Without this override the
  # default would resolve to /app/data/telemetry which is on ephemeral storage and
  # would be wiped on every pod restart. See docs/recall_feature_review_2026-05-26.md §7.1.
  Telemetry__BaseDirectory: "/app/data/user_memories/telemetry"
  Telemetry__RetentionDays: "30"
  # Conversation transcript logging (full prompt + reply) for quality evaluation. Nested inside the
  # PVC mount so it survives pod rotation. Contains raw user content and IDs by design; retention is
  # shorter than telemetry because content is larger. See docs/improvement_opportunities_2026-06-10.md H2.
  Transcript__Enabled: "true"
  Transcript__BaseDirectory: "/app/data/user_memories/transcripts"
  Transcript__RetentionDays: "14"
  # Reaction logging (the reception signal): which reactions land on the bot's own messages. Nested in
  # the PVC mount so it survives pod rotation. Low-sensitivity (emoji + IDs + a short reply excerpt).
  Reactions__Enabled: "true"
  Reactions__BaseDirectory: "/app/data/user_memories/reactions"
  Reactions__RetentionDays: "30"
  # In-character emoji reactions: on a message he did NOT reply to, a cheap LLM (UtilityModel) decides whether
  # Robotnik renders a one-emoji verdict (from the unicode palette + the guild's custom emotes) or declines.
  # Two throttles: MinInterval caps judge calls per channel (react OR decline = cost guard); Quiet is how long
  # he stays silent AFTER an actual reaction so he never carpet-reacts (a decline does not start it).
  Reactions__EmojiReactEnabled: "true"
  Reactions__EmojiReactMinIntervalSeconds: "15"
  Reactions__EmojiReactQuietSeconds: "90"
  Reactions__MaxCustomEmotes: "40"
  # Empire State: Robotnik's persistent world (mood + war-room log), advanced by a slow verified sleep-tick.
  # ENABLED: injection reads the log into every reply; the tick evolves it every N hours (skipped when idle).
  # EnableLlmBody=false freezes the log to the seed body plus deterministic mood (kill switch). Path is on the PVC.
  EmpireState__Enabled: "true"
  EmpireState__Path: "/app/data/user_memories/empire_state.json"
  EmpireState__TickIntervalHours: "6"
  EmpireState__EnableLlmBody: "true"
  EmpireState__BodyMaxChars: "1200"
  EmpireState__MinBodyRetainFraction: "0.5"
  EmpireState__MoodRetain: "0.7"
  EmpireState__BaselineValence: "0.3"
  EmpireState__BaselineArousal: "0.2"
  EmpireState__RanksMax: "40"
  EmpireState__RankIdleTicksMax: "8"
  EmpireState__MaxRankOpsPerTick: "2"
  EmpireState__MaxRankTitleLength: "40"
  EmpireState__CandidateSampleSize: "10"
  EmpireState__RecentParticipantTtlHours: "6"
  # Proven bits: rank his best-received past lines (by reaction) and feed the winners back into the persona prompt.
  Reactions__ProvenBitsEnabled: "true"
  Reactions__ProvenBitsPoolSize: "10"
  Reactions__ProvenBitsLookbackDays: "30"
  Reactions__ProvenBitsRefreshHours: "6"
  # Image generation (docs/image_generation_design.md). OFF by default: enabling spends real money and
  # requires the OpenAI org to pass API Organization Verification first, plus an OpenAI image API key in
  # the Secret (LLM__Providers__OpenAI__ApiKey is reused). The log lives inside the PVC mount so the
  # durable daily cap and monthly guard survive pod rotation (a crash loop must not blow the budget).
  Image__Enabled: "true"
  Image__Model: "gpt-image-2"
  Image__Size: "1024x1024"
  Image__Quality: "medium"
  Image__SpontaneousModel: "gpt-image-1-mini"
  Image__SpontaneousQuality: "low"
  Image__OutputFormat: "jpeg"
  Image__Moderation: "auto"
  Image__PerUserPerHour: "20"
  Image__GlobalPerDay: "250"
  Image__MaxConcurrent: "20"
  Image__MonthlyUsdGuard: "200"
  Image__AllowHighQuality: "false"
  Image__AmbientChance: "0.25"
  Image__BaseDirectory: "/app/data/user_memories/images"
  Image__RetentionDays: "60"
  # Scam-link guard: proactive in-character warnings on obvious phishing/crypto-scam links.
  ScamGuard__Enabled: "true"
  ScamGuard__CooldownSeconds: "45"
  ScamGuard__TreatShortenersAsSignal: "true"
  # Scan other bots/webhooks (the primary raid vector) plus behavioral raid detection and reporting.
  ScamGuard__ScanBotMessages: "true"
  ScamGuard__NewAccountDays: "21"
  # New-account behavioral watch: alert mods (in character) when a very new account posts a payload. Alert-only.
  ScamGuard__AlertNewAccounts: "true"
  ScamGuard__NewAccountAlertThreshold: "3"
  ScamGuard__NewAccountAlertCooldownSeconds: "600"
  ScamGuard__RaidWindowSeconds: "60"
  ScamGuard__RaidChannelThreshold: "3"
  ScamGuard__RaidRepeatThreshold: "4"
  ScamGuard__AlertChannelName: "pepega-chat-supreme"
  ScamGuard__LearnedListPath: "/app/data/user_memories/learned_scams.json"
  # Phishing-domain feed (Sinking Yachts), mirrored locally to the PVC. Fail-open.
  ScamGuard__UsePhishingFeed: "true"
  ScamGuard__PhishingFeedUrl: "https://phish.sinking.yachts"
  ScamGuard__PhishingFeedRefreshMinutes: "15"
  ScamGuard__PhishingFeedIdentity: "discord-sky-bot (private friend server)"
  ScamGuard__PhishingFeedCachePath: "/app/data/user_memories/phishing_domains.json"
  # AutoMod sync: native Discord AutoMod rules seeded from ScamGuard lists (proactive, all senders).
  # Two tiers: {prefix}-block (lookalike domains -> BLOCK + alert), {prefix}-alert (phrases -> alert only).
  AutoMod__Enabled: "true"
  AutoMod__RuleNamePrefix: "sky-scamguard"
  AutoMod__BlockLookalikes: "true"
  AutoMod__AlertPhrases: "true"
  AutoMod__AlertChannelName: "pepega-chat-supreme"
  AutoMod__GuildAllowList__0: "Flavorful Feral's Funhouse"
  AutoMod__ExemptChannelNames__0: "pepega-chat-supreme"
  # Read side: record native AutoMod block/alert actions as "automod_action" telemetry. Taunt is opt-in.
  AutoMod__ReactToActions: "true"
  AutoMod__TauntOnBlock: "true"
  AutoMod__TauntCooldownSeconds: "60"
  AutoMod__ProtectMentionRaids: "true"
  AutoMod__MentionLimit: "5"
  # Native ML "generic spam" filter (free-nitro / invite spam). Alert-only, English-only, free recall.
  AutoMod__UseNativeSpamFilter: "true"
  # Member events: in-house mass-join raid detection + in-character greeting. DORMANT until the
  # "Server Members Intent" is enabled in the Discord dev portal AND MemberEvents__Enabled is "true".
  MemberEvents__Enabled: "false"
  MemberEvents__GreetNewMembers: "true"
  MemberEvents__AlertChannelName: "pepega-chat-supreme"
  MemberEvents__JoinRaidWindowSeconds: "30"
  MemberEvents__JoinRaidThreshold: "5"
  # Recall-tool config (replaces implicit memory relevance gating).
  # See docs/recall_tool_design.md §3 and §4.2.
  MemoryRelevance__RecallTopK: "8"
  MemoryRelevance__MaxRecallsPerReply: "3"
  MemoryRelevance__MaxRecallsPerAmbientReply: "1"
  MemoryRelevance__SuppressionOverlapThreshold: "0.3"
  # Legacy keys below are unused under the recall-tool design but kept to avoid
  # breaking option binding during rollout. Remove after one stable release.
  MemoryRelevance__Mode: "ShadowOnly"
  MemoryRelevance__HardFloor: "0.15"
  MemoryRelevance__AdmissionThreshold: "0.35"
  MemoryRelevance__ConfidenceGap: "2.0"
  MemoryRelevance__MaxInjectedMemories: "2"
  MemoryRelevance__LateralInhibition: "0.5"
  MemoryRelevance__RecentMessageWindow: "3"
  MemoryRelevance__KindAmbientThreshold__Factual: "0.35"
  MemoryRelevance__KindAmbientThreshold__Experiential: "0.85"
  MemoryRelevance__KindAmbientThreshold__Running: "999999"
  MemoryRelevance__KindAmbientThreshold__Meta: "999999"
