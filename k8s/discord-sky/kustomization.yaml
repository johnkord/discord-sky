apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: discord-sky

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml

# Credential secrets are managed out-of-band. The private Steward profile Secret is generated only in
# deploy.sh's temporary overlay and is never committed to this public base. See k8s/discord-sky/README.md.
