name: Build and Deploy to AKS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: ribacr123
  ACR_LOGIN_SERVER: ribacr123.azurecr.io
  AKS_RESOURCE_GROUP: jk-aks-rg-2
  AKS_CLUSTER_NAME: jk-aks-2
  IMAGE_NAME: discordskybot
  K8S_NAMESPACE: discord-sky

permissions:
  contents: read

jobs:
  validate:
    name: Validate Sky and pinned Steward
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      steward_ref: ${{ steps.identity.outputs.steward_ref }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve source identity
        id: identity
        shell: bash
        run: |
          ref=$(<scripts/steward-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "steward_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=tree-${tree}-s${ref:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: johnkord/discord-steward
          ref: ${{ steps.identity.outputs.steward_ref }}
          path: discord-steward-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release build, audit, unit and integration tests
        env:
          STEWARD_TEST_ROOT: ${{ github.workspace }}/discord-steward-source
          RESULTS_DIRECTORY: ${{ runner.temp }}/test-results
        run: bash scripts/validate-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: ${{ runner.temp }}/test-results/*.trx

  build-and-deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: discord-sky-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned Discord Steward
        uses: actions/checkout@v4
        with:
          repository: johnkord/discord-steward
          ref: ${{ needs.validate.outputs.steward_ref }}
          path: discord-steward-source

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check for an already deployed and ready source tree
        id: live
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
          image="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          live=$(kubectl -n "$K8S_NAMESPACE" get deployment discord-sky-bot -o jsonpath='{.spec.template.spec.containers[0].image}')
          if [[ "$live" == "$image" ]]; then
            digest=$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_NAME:$IMAGE_TAG" --query digest -o tsv)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            kubectl -n "$K8S_NAMESPACE" rollout status deployment/discord-sky-bot --timeout=300s
            kubectl -n "$K8S_NAMESPACE" get pods -l app=discord-sky-bot -o json | jq -e --arg digest "$digest" --arg image "$image" '[.items[] | select(.metadata.deletionTimestamp==null) | .status.containerStatuses[] | select(.name=="bot")] | length==1 and all(.ready and .image==$image and (.imageID|endswith($digest)))'
            echo 'already=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and safely deploy combined runtime
        if: steps.live.outputs.already != 'true'
        shell: bash
        run: |
          bash scripts/deploy.sh \
            --aks-resource-group "${AKS_RESOURCE_GROUP}" \
            --aks-cluster "${AKS_CLUSTER_NAME}" \
            --acr-name "${ACR_NAME}" \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${{ needs.validate.outputs.image_tag }}" \
            --include-steward \
            --steward-project discord-steward-source/src/DiscordSteward/DiscordSteward.csproj \
            --preserve-steward-profiles

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Image deployed: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.image_tag }}"
