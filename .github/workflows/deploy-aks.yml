name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: ribacr123
  ACR_LOGIN_SERVER: ribacr123.azurecr.io
  AKS_RESOURCE_GROUP: jk-aks-rg-2
  AKS_CLUSTER_NAME: jk-aks-2
  IMAGE_NAME: discordskybot
  K8S_NAMESPACE: discord-sky
  STEWARD_REF: 4ca56f92fc92f85a0029fbc839091a0b264d5709

permissions:
  contents: read

concurrency:
  group: discord-sky-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned Discord Steward
        uses: actions/checkout@v4
        with:
          repository: johnkord/discord-steward
          ref: ${{ env.STEWARD_REF }}
          path: discord-steward-source

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set combined image tag
        id: vars
        shell: bash
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}-s${STEWARD_REF:0:7}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and safely deploy combined runtime
        shell: bash
        run: |
          bash scripts/deploy.sh \
            --aks-resource-group "${AKS_RESOURCE_GROUP}" \
            --aks-cluster "${AKS_CLUSTER_NAME}" \
            --acr-name "${ACR_NAME}" \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${{ steps.vars.outputs.IMAGE_TAG }}" \
            --include-steward \
            --steward-project discord-steward-source/src/DiscordSteward/DiscordSteward.csproj \
            --preserve-steward-profiles

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Image deployed: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}"
