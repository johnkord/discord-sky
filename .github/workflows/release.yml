name: Validate and publish

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Publishing needs repository variables ACR_NAME and ACR_RESOURCE_GROUP (optional IMAGE_NAME) and OIDC secrets
# AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID; see the README's Production Deployment.
env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'discordskybot' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Sky and pinned Steward
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      steward_ref: ${{ steps.identity.outputs.steward_ref }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve source identity
        id: identity
        shell: bash
        run: |
          ref=$(<scripts/steward-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "steward_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=tree-${tree}-s${ref:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: johnkord/discord-steward
          ref: ${{ steps.identity.outputs.steward_ref }}
          path: discord-steward-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release build, audit, unit and integration tests
        env:
          STEWARD_TEST_ROOT: ${{ github.workspace }}/discord-steward-source
          RESULTS_DIRECTORY: ${{ runner.temp }}/test-results
        run: bash scripts/validate-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: ${{ runner.temp }}/test-results/*.trx

  publish:
    name: Build and publish the combined image
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: discord-sky-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned Discord Steward
        uses: actions/checkout@v4
        with:
          repository: johnkord/discord-steward
          ref: ${{ needs.validate.outputs.steward_ref }}
          path: discord-steward-source

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Skip an already published source tree
        id: published
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          digest=$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_NAME:$IMAGE_TAG" --query digest -o tsv 2>/dev/null || true)
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build, check and push the combined runtime image
        if: steps.published.outputs.already != 'true'
        shell: bash
        run: |
          bash scripts/deploy.sh --skip-rollout \
            --acr-name "${ACR_NAME}" \
            --acr-resource-group "${ACR_RESOURCE_GROUP}" \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${{ needs.validate.outputs.image_tag }}" \
            --include-steward \
            --steward-project discord-steward-source/src/DiscordSteward/DiscordSteward.csproj

      - name: Release summary
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          set -euo pipefail
          digest=$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_NAME:$IMAGE_TAG" --query digest -o tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Published, not deployed'
            echo "- Image: \`$IMAGE_NAME:$IMAGE_TAG\`"
            echo "- Digest: \`$digest\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo ''
            echo 'Release it on the Compose host with this digest and the public settings of the same commit (README, Production Deployment).'
          } >> "$GITHUB_STEP_SUMMARY"
